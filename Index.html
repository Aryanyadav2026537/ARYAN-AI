
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARYAN AI - Your AI Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#080d1a;
color:white;
min-height:100vh;
}
header{
padding:20px;
background:#111a2e;
border-bottom:1px solid #263653;
display:flex;
align-items:center;
justify-content:space-between;
}
.logo{font-size:25px;font-weight:bold;color:#63a8ff}
.logo span{color:#b17cff}
main{
max-width:850px;
margin:auto;
padding:30px 18px;
}
.welcome{text-align:center;margin:55px 0 35px}
.welcome h1{font-size:38px;margin-bottom:12px}
.welcome h1 span{color:#8b7cff}
.welcome p{color:#aab7d0}
.chatbox{
background:#111a2e;
border:1px solid #293957;
border-radius:18px;
padding:15px;
}
#messages{
height:300px;
overflow-y:auto;
padding:10px;
}
.message{
padding:13px;
border-radius:12px;
margin-bottom:12px;
line-height:1.5;
white-space:pre-wrap;
}
.user{background:#263e70;margin-left:35px}
.bot{background:#1b2940;margin-right:35px}
.input-area{display:flex;gap:10px}
input{
flex:1;min-width:0;
padding:15px;
border-radius:12px;
border:1px solid #35476b;
background:#0a1222;
color:white;
outline:none;
}
button{
border:0;
border-radius:12px;
background:linear-gradient(135deg,#637cff,#a45bff);
color:white;
padding:14px 20px;
font-weight:bold;
cursor:pointer;
}
button:disabled{opacity:.5}
footer{text-align:center;color:#71809b;margin-top:30px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">ARYAN <span>AI</span></div>
<div>🤖 Your AI Assistant</div>
</header>
<main>
<div class="welcome">
<h1>Hello, I'm <span>ARYAN AI</span></h1>
<p>Your smart AI assistant. Ask me anything!</p>
</div>
<div class="chatbox">
<div id="messages">
<div class="message bot">Hello! 👋 Welcome to ARYAN AI. How can I help you today?</div>
</div>
<div class="input-area">
<input id="prompt" placeholder="Ask anything..." />
<button id="send" onclick="sendMessage()">Send ➤</button>
</div>
</div>
<footer>© 2026 ARYAN AI · Made with ❤️</footer>
</main>
<script>
const input=document.getElementById("prompt");
const messages=document.getElementById("messages");

function addMessage(text,type){
const div=document.createElement("div");
div.className="message "+type;
div.textContent=text;
messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
}

async function sendMessage(){
const question=input.value.trim();
if(!question)return;
addMessage(question,"user");
input.value="";
addMessage("ARYAN AI ka AI backend abhi connect nahi hua hai. Jaldi hi main aapke liye ready ho jaunga! 🚀","bot");
}

input.addEventListener("keydown",e=>{
if(e.key==="Enter")sendMessage();
});
</script>
</body>
</html>
